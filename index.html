<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的足跡地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: short header, then one card per map with live progress read from this browser's saved records. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1b1e26; --muted:#5f6573; --line:#dcdfe5;
  --jp:#4466b0; --cn:#b4452f;
  --font-display:"Noto Serif TC","Songti TC",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121418; --surface:#1b1e24; --ink:#e9ebf0; --muted:#9ea4b1; --line:#30343d; --jp:#80a0e4; --cn:#e1876f; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:40px 20px 56px;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--font-display);font-size:36px;line-height:1.2;margin:0;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--muted);max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.card{display:flex;flex-direction:column;gap:10px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;border-top:4px solid var(--c)}
a.card:hover{border-color:var(--c)}
a.card:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.card h2{margin:0;font-size:19px}
.card .what{margin:0;color:var(--muted);font-size:13.5px}
.nums{display:flex;gap:22px;font-variant-numeric:tabular-nums}
.nums div{display:flex;flex-direction:column}
.nums b{font-family:var(--font-display);font-size:30px;line-height:1.1;color:var(--c)}
.nums b small{font-family:var(--font-body);font-size:14px;color:var(--muted);font-weight:400}
.nums span{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.go{font-size:14px;color:var(--c);font-weight:500}
.note{font-size:13px;color:var(--muted);margin:0;max-width:70ch}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>我的足跡地圖</h1>
    <p class="sub">用各國的行政區劃記錄去過的地方，以日本「経県値」計分：居住 5、住宿 4、遊玩 3、短暫停留 2、路過 1。</p>
  </header>
  <section class="grid" id="grid"></section>
  <p class="note">紀錄存在這個瀏覽器裡。清除瀏覽器資料會一併刪掉紀錄，建議偶爾在各地圖頁按「複製備份」留一份。</p>
</div>
<script>
(function(){
  const MAPS = [
    {href:"japan.html", key:"pref-tracker-japan-v1", name:"日本", what:"47 都道府縣", total:47, color:"var(--jp)"},
    {href:"china-tw.html", key:"pref-tracker-china-tw-v1", name:"中國（含臺灣）", what:"34 個地區", total:34, color:"var(--cn)"}
  ];
  const grid = document.getElementById("grid");
  for (const m of MAPS){
    let levels = {};
    try { levels = JSON.parse(localStorage.getItem(m.key) || "{}") || {}; } catch(e){}
    const vals = Object.values(levels).map(Number).filter(v => Number.isInteger(v) && v >= 1 && v <= 5);
    const visited = vals.filter(v => v >= 2).length;
    const score = vals.reduce((a,b) => a + b, 0);
    const a = document.createElement("a");
    a.className = "card"; a.href = m.href; a.style.setProperty("--c", m.color);
    a.innerHTML = `<h2></h2><p class="what"></p>
      <div class="nums"><div><b>${visited}<small> / ${m.total}</small></b><span>已到訪</span></div>
      <div><b>${score}<small> / ${m.total*5}</small></b><span>經縣值</span></div></div>
      <div class="bar"><i style="width:${visited/m.total*100}%"></i></div>
      <span class="go">打開地圖 →</span>`;
    a.querySelector("h2").textContent = m.name;
    a.querySelector(".what").textContent = m.what;
    grid.appendChild(a);
  }
})();
</script>
</body>
</html>
